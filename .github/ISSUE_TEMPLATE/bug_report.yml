name: Bug report
description: Wrong output, a code that won't scan, a crash or a type error.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The exact input and options are the most useful thing you can give us.
        Security problems should be reported privately instead; see [SECURITY.md](https://github.com/fadyehabamer/qr-zero/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input text
      description: The exact text you encoded. If it contains private data, replace it with something of the same length and character types that still shows the problem. For `Uint8Array` input, paste the bytes.
      render: text
    validations:
      required: true
  - type: dropdown
    id: ec-level
    attributes:
      label: Error-correction level
      options:
        - M (default)
        - L
        - Q
        - H
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Other options and API used
      description: 'The call you made, e.g. `encode(text, { mode: "auto", eci: true, minVersion: 5 })` and `toSvg(qr, { margin: 2 })`, or the CLI command line.'
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: qr-zero version
      placeholder: e.g. 0.2.0, or a commit on main
    validations:
      required: true
  - type: input
    id: symbol
    attributes:
      label: Symbol version and mask (if relevant)
      description: "`qr.version` and `qr.mask` from the result."
      placeholder: e.g. version 7, mask 3
  - type: dropdown
    id: area
    attributes:
      label: Where does it go wrong?
      options:
        - encode() output / scanning
        - toSvg / toDataURL / toSvgPath
        - toCanvas
        - toString (terminal)
        - qr-zero/react
        - CLI
        - Types / packaging (import, require, bundlers)
    validations:
      required: true
  - type: input
    id: scanner
    attributes:
      label: Scanner used
      description: For codes that don't scan, the app or library that failed (and any that worked).
      placeholder: e.g. iOS 18 Camera fails, Android Google Lens works, ZXing 3.5
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: e.g. Node 22.4, Bun 1.2, Chrome 128, Vite 6
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots of the code, the rendered SVG, error messages or stack traces.
